name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install test and lint dependencies
        run: python -m pip install --quiet pytest "cryptography>=41" h2 ruff bandit "setuptools>=59.6" wheel

      - name: Lint the independent implementation
        run: ruff check rebuild

      - name: Scan implementation for security issues
        run: bandit -r rebuild --exclude rebuild/tests -ll -s B104

      - name: Run all tests
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ.get("RUNNER_TEMP", ".")) / "pytest-results.xml"
          result = subprocess.run(
              [sys.executable, "-m", "pytest", "-q", f"--junitxml={report}"],
              text=True, capture_output=True,
          )
          sys.stdout.write(result.stdout)
          sys.stderr.write(result.stderr)
          if result.returncode:
              if report.exists():
                  root = ET.parse(report).getroot()
                  for testcase in root.findall(".//testcase"):
                      failure = testcase.find("failure")
                      if failure is None:
                          failure = testcase.find("error")
                      if failure is None:
                          continue
                      name = f"{testcase.get('classname', '')}::{testcase.get('name', 'test')}"
                      message = failure.get("message", "") or failure.text or "test failure"
                      escaped_name = name.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      escaped = message[:4000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title=pytest {escaped_name}::{escaped}")
              else:
                  message = (result.stdout + result.stderr)[-4000:]
                  escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=pytest did not produce a report::{escaped}")
              raise SystemExit(result.returncode)
          PY

      - name: Build and inspect the installable wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip install --no-deps dist/*.whl
          simurgh-next --help
          simurgh-next-panel --help
          simurgh-next-node --help
          simurgh-next-update --help

  shell:
    name: Installer syntax and static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Syntax check
        run: bash -n install.sh

      - name: ShellCheck
        run: shellcheck -S warning install.sh
