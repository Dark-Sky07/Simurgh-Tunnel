name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests and installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check the shell scripts
        run: |
          bash -n install.sh
          bash -n tools/build-go.sh

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -S warning install.sh tools/build-go.sh

      - name: Install test tooling
        run: python -m pip install --quiet pytest "cryptography>=41"

      - name: Run the test suite
        run: python -m pytest -q
