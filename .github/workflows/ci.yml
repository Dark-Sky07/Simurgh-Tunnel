name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests on python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest interpreter the installer accepts, 3.12 the newest
        # of the two 3.11+ lines; the installer itself runs in both
        python: ["3.9", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test tooling
        run: python -m pip install --quiet pytest "cryptography>=41"

      - name: Run the test suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      # Ubuntu 22.04 ships Python 3.10, where the standard library has no
      # tomllib: the bundled reader has to take over, and that is exactly what
      # the installer hit on a stock server.
      - name: Run the test suite without tomllib
        if: matrix.python == '3.12'
        env:
          SIMURGH_TEST_NO_TOMLLIB: "1"
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest-no-tomllib.log"

      # show the failing tests both in the job summary and as an annotation
      # (annotations are readable through the checks API without downloading
      # the whole job log)
      - name: Summarise failures
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/pytest*.log; do
            [ -f "$log" ] || continue
            title="pytest $(basename "$log")"
            echo "::error title=$title::$(tail -n 12 "$log" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            {
              echo "### python ${{ matrix.python }} — $(basename "$log")"
              echo '```'
              grep -E "FAILED|ERROR|assert|Error|error:" "$log" | tail -n 40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

  shell:
    name: installer and shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n install.sh
          bash -n tools/build-go.sh

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -S warning install.sh tools/build-go.sh

  packages:
    name: packages (.deb, .rpm, tarball, image)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build the compiled engine
        run: bash tools/build-go.sh --release dist

      - name: rpmbuild (dpkg-deb is already there)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Build every package from the same tree
        run: |
          bash packaging/build-packages.sh --out dist
          bash packaging/build-packages.sh --out dist \
               --go-binary dist/simurgh-go-linux-amd64
          ls -l dist

      - name: Inspect what was built
        run: |
          set -e
          dpkg-deb -I dist/simurgh_*_all.deb
          dpkg-deb -c dist/simurgh_*_amd64.deb | grep -E 'usr/bin/(simurgh|simurgh-go)$'
          rpm -qip dist/simurgh-*.noarch.rpm
          rpm -qlp dist/simurgh-*.x86_64.rpm | grep -E '^/usr/bin/simurgh(-go)?$'

      - name: Run the tarball the way a user would
        run: |
          set -e
          mkdir -p /tmp/root && tar -xzf dist/simurgh-*-noarch.tar.gz -C /tmp/root
          SIMURGH_LIB=/tmp/root/usr/lib/simurgh /tmp/root/usr/bin/simurgh --version
          SIMURGH_LIB=/tmp/root/usr/lib/simurgh /tmp/root/usr/bin/simurgh tune

      - name: Build the image and the compose file
        run: |
          docker build -t simurgh:ci .
          docker run --rm simurgh:ci --version
          docker run --rm simurgh:ci simurgh-go version
          docker compose config -q
          docker run --rm --entrypoint /bin/sh simurgh:ci -c \
            'SIMURGH_HOME=/tmp/none simurgh-entrypoint relay; test $? -eq 1'

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.deb
          retention-days: 7

      - name: Keep the tarballs and rpms too
        uses: actions/upload-artifact@v4
        with:
          name: packages-extra
          path: |
            dist/*.rpm
            dist/*.tar.gz
          retention-days: 7
