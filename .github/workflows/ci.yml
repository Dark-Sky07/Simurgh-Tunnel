name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install test and lint dependencies
        run: python -m pip install --quiet pytest "cryptography>=41" ruff "setuptools>=59.6" wheel

      - name: Lint the independent implementation
        run: ruff check rebuild

      - name: Run all tests
        run: python -m pytest -q

      - name: Build and inspect the installable wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip install --no-deps dist/*.whl
          simurgh-next --help
          simurgh-next-panel --help
          simurgh-next-update --help

  shell:
    name: Installer syntax and static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Syntax check
        run: bash -n install.sh

      - name: ShellCheck
        run: shellcheck -S warning install.sh
