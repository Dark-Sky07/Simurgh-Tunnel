name: Release Go binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload binaries to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and attach release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build all release targets
        run: bash tools/build-go.sh --release dist

      - name: Create SHA-256 checksums
        run: |
          cd dist
          sha256sum simurgh-go-* > SHA256SUMS.txt

      - name: Attach binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
