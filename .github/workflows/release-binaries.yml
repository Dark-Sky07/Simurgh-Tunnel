name: Release Go binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload binaries to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and attach release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build all release targets
        run: bash tools/build-go.sh --release dist

      - name: Create SHA-256 checksums
        run: |
          cd dist
          sha256sum simurgh-go-* > SHA256SUMS.txt

      - name: Attach binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  packages:
    name: Build and attach packages
    # Match CI and avoid apt stalls on the moving ubuntu-latest image.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build the compiled engine for this runner
        run: bash tools/build-go.sh --release dist

      - name: rpmbuild for the .rpm (dpkg-deb ships with the runner)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Build every package (pure Python and with the engine)
        run: |
          bash packaging/build-packages.sh --out dist
          bash packaging/build-packages.sh --out dist \
               --go-binary dist/simurgh-go-linux-amd64

      # the binaries have their own file, produced by the build job
      - name: Checksums for the packages
        run: |
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS-packages.txt
          cat SHA256SUMS-packages.txt

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/*.deb dist/*.rpm dist/*.tar.gz dist/SHA256SUMS-packages.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Say what went out
        run: ls -l dist
