name: Release Python package

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Build and attach release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the released source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c 'from rebuild.tunnel import VERSION; print(VERSION)')
          case "$RELEASE_TAG" in "simurgh-next-v$VERSION") ;; *)
            echo "Release tag $RELEASE_TAG does not match source version $VERSION" >&2
            exit 1
            ;;
          esac

      - name: Build wheel and source archive
        run: |
          python -m pip install --quiet "setuptools>=59.6" wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python setup.py sdist --dist-dir dist

      - name: Attest the source archive with GitHub build provenance
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz

      - name: Keep the Sigstore bundle beside the source archive
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          SDIST=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$SDIST"
          test -f "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "$SDIST.sigstore.json"

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
