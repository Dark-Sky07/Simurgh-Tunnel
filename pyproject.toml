[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simurgh-tunnel"
version = "3.2.4"
description = "Simurgh Tunnel v2 — an Iran <-> Kharej transparent TCP/UDP relay for VPN panels (3x-ui, OMEGA, X-UI, ...)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Simurgh Tunnel contributors" }]
keywords = ["tunnel", "relay", "iran", "kharej", "gost", "rathole", "3x-ui", "censorship"]
dependencies = []

[project.optional-dependencies]
secure = ["cryptography>=41"]

[project.scripts]
simurgh = "simurgh.cli:main"

[tool.setuptools.packages.find]
include = ["simurgh*"]

# the bundled TOML reader keeps its licence next to it, and ships a py.typed
# marker so type checkers work on every supported Python
[tool.setuptools.package-data]
"simurgh._tomli" = ["LICENSE", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
