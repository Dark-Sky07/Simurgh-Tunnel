[metadata]
name = simurgh-tunnel
version = attr: simurgh.__version__
description = Simurgh Tunnel v2 — an Iran <-> Kharej transparent TCP/UDP relay for VPN panels (3x-ui, OMEGA, X-UI, ...)
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Simurgh Tunnel contributors
keywords = tunnel, relay, iran, kharej, gost, rathole, 3x-ui, censorship

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = simurgh*

# Keep the TOML reader's licence and type marker, and every local panel asset,
# in installed wheels. /healthz alone must never hide missing dashboard files.
[options.package_data]
simurgh = assets/*
simurgh._tomli = LICENSE, py.typed

[options.entry_points]
console_scripts =
    simurgh = simurgh.cli:main

[options.extras_require]
secure =
    cryptography>=41
