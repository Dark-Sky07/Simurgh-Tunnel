[metadata]
name = simurgh-tunnel
version = attr: rebuild.tunnel.VERSION
description = Independent clean-room Simurgh Tunnel for authenticated TCP and UDP forwarding
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Simurgh Tunnel contributors

[options]
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
include = rebuild*
exclude = rebuild.tests*

[options.package_data]
rebuild = examples/*.json

[options.entry_points]
console_scripts =
    simurgh-next = rebuild.menu:main
    simurgh-next-panel = rebuild.panel:main
    simurgh-next-setup = rebuild.wizard:main
    simurgh-next-node = rebuild.tunnel:main
    simurgh-next-update = rebuild.updates:main
